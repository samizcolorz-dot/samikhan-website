# Apex — the one canonical host.
server {
    server_name samikhanapps.com;

    root /var/www/samikhan-website;
    index index.html;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # /index.html duplicates /. Matched on $request_uri, which keeps the
    # original URI, so the internal "/" -> "/index.html" rewrite from the
    # index directive cannot loop back into this redirect.
    if ($request_uri = /index.html) { return 301 /; }

    # Legacy flat URLs -> real 301s to the new folder pages
    # (mirrors netlify.toml redirects; the .html stub files still exist
    # as a fallback with client-side meta-refresh + noindex)
    location = /about.html { return 301 /about/; }
    location = /contact.html { return 301 /contact/; }
    location = /experience.html { return 301 /experience/; }
    location = /work.html { return 301 /experience/; }
    location = /products.html { return 301 /projects/; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|svg|webp|ico)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        # add_header in a location replaces the server-level set, so the
        # security headers have to be repeated here.
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/samikhanapps.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/samikhanapps.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www -> apex. Was serving a duplicate 200 of the whole site.
server {
    listen 443 ssl;
    server_name www.samikhanapps.com;

    ssl_certificate /etc/letsencrypt/live/samikhanapps.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/samikhanapps.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    return 301 https://samikhanapps.com$request_uri;
}

# Port 80 -> straight to the https apex, one hop for both hosts.
server {
    listen 80;
    server_name samikhanapps.com www.samikhanapps.com;
    return 301 https://samikhanapps.com$request_uri;
}
